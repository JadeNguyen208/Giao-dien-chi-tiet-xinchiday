<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Công Việc – Xin Chỉ Dạy</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root {
  --green-dark:#1a5c3a; --green-mid:#2d7a52; --green-light:#e8f5ee; --green-pale:#f2faf5;
  --red:#c0392b; --red-light:#fdecea;
  --orange:#e8720a; --orange-light:#fff0e4;
  --yellow:#c9950a; --yellow-light:#fffbdf;
  --teal:#00796b; --teal-light:#e0f2f1;
  --gray-bg:#f0f2f5; --gray-border:#e2e5ea; --gray-text:#6b7280; --dark:#111827;
  --topbar-h:56px; --font:'Be Vietnam Pro',sans-serif;
  --shadow-sm:0 1px 4px rgba(0,0,0,.07); --shadow-md:0 4px 16px rgba(0,0,0,.1); --shadow-lg:0 8px 32px rgba(0,0,0,.15);
  --status-urgent-bg: #c0392b; --status-urgent-color: #fff;
  --status-urgent-notimportant-bg: #e07b3a; --status-urgent-notimportant-color: #000;
  --status-noturgent-important-bg: #d4a017; --status-noturgent-important-color: #5a3600;
  --status-normal-bg: #00796b; --status-normal-color: #fff;
  --topbar-bg: #fad96a; --topbar-border: #f0c840;
  --topbar-logo-color: #7a3a00; --topbar-text-dark: #5a2d00;
  --topbar-date-bg: rgba(255,255,255,0.55); --topbar-date-border: rgba(255,255,255,0.6);
  --topbar-btn-bg: rgba(255,255,255,0.5); --topbar-btn-border: rgba(255,200,60,0.5);
  --topbar-user-bg: rgba(255,255,255,0.5); --topbar-lunar-color: #8b4a00;
  --icon-color: #1a5c3a; --icon-bg: #f5f0e8;
}
html,body,input,select,textarea,button{font-family:var(--font);}
html,body{background:var(--gray-bg);color:var(--dark);height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
.topbar{height:var(--topbar-h);background:var(--topbar-bg);border-bottom:1.5px solid var(--topbar-border);display:flex;align-items:center;padding:0 18px;flex-shrink:0;position:relative;z-index:100;box-shadow:0 2px 8px rgba(180,120,0,.18);}
.tb-logo{display:flex;align-items:center;gap:10px;}
.tb-logo-main{font-size:17px;font-weight:800;color:var(--topbar-logo-color);letter-spacing:-.3px;}
.tb-divider{width:1px;height:28px;background:rgba(140,80,0,.25);margin:0 14px;flex-shrink:0;}
.tb-date{padding:5px 12px;background:var(--topbar-date-bg);border-radius:9px;border:1px solid var(--topbar-date-border);backdrop-filter:blur(4px);}
.tb-date-solar{font-size:14px;font-weight:700;color:var(--topbar-text-dark);line-height:1;}
.tb-date-lunar{font-size:11px;color:var(--topbar-lunar-color);font-weight:600;margin-top:3px;line-height:1;}
.tb-spacer{flex:1;}
.tb-actions{display:flex;align-items:center;gap:6px;}
.tb-btn{width:36px;height:36px;background:var(--topbar-btn-bg);border-radius:9px;border:1px solid var(--topbar-btn-border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:16px;transition:background .15s;}
.tb-btn:hover{background:rgba(255,255,255,.7);}
.tb-notif-count{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--topbar-bg);}
.tb-user{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;background:var(--topbar-user-bg);border-radius:9px;border:1px solid var(--topbar-btn-border);cursor:pointer;margin-left:3px;transition:background .15s;}
.tb-user:hover{background:rgba(255,255,255,.7);}
.tb-avatar{width:28px;height:28px;border-radius:50%;background:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.tb-user-name{font-size:13px;font-weight:700;color:var(--topbar-text-dark);line-height:1.2;}
.tb-user-role{font-size:10px;color:var(--topbar-lunar-color);margin-top:1px;}
.app-body{display:flex;height:calc(100vh - var(--topbar-h));overflow:hidden;}
.left-panel{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--gray-bg);border-right:1.5px solid var(--gray-border);}
.legend-row{padding:6px 18px;background:#fafbfc;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;gap:16px;flex-shrink:0;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gray-text);font-weight:500;}
.lb{width:10px;height:10px;border-radius:50%;}
.lb-red{background:var(--status-urgent-bg);}
.lb-orange{background:var(--status-urgent-notimportant-bg);}
.lb-yellow{background:var(--status-noturgent-important-bg);}
.lb-teal{background:var(--status-normal-bg);}
.ban-area{flex:1;overflow-y:auto;padding:14px 18px;}
.ban-grid-detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.ban-card-detail{background:#fff;border-radius:14px;border:1.5px solid var(--gray-border);overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .18s;box-shadow:var(--shadow-sm);position:relative;}
.ban-card-detail:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.card-top-badge{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:4px;height:22px;border-radius:11px;font-size:10px;font-weight:800;padding:0 9px;box-shadow:0 1px 5px rgba(0,0,0,.18);border:2px solid #fff;white-space:nowrap;z-index:5;}
.card-top-badge-red{background:var(--status-urgent-bg);color:var(--status-urgent-color);}
.card-top-badge-orange{background:var(--status-urgent-notimportant-bg);color:var(--status-urgent-notimportant-color);}
.card-top-badge-yellow{background:var(--status-noturgent-important-bg);color:var(--status-noturgent-important-color);}
.card-top-badge-teal{background:var(--status-normal-bg);color:var(--status-normal-color);}
.bcd-top{display:flex;align-items:center;gap:10px;padding:12px 110px 10px 12px;border-bottom:1px solid var(--gray-border);}
.bcd-icon-wrap{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:var(--icon-bg);}
.bcd-name{font-size:16px;font-weight:800;color:var(--dark);line-height:1.2;flex:1;}
.bcd-body{padding:10px 12px 4px;}
.bcd-task-item{display:flex;align-items:flex-start;gap:6px;padding:5px 0;border-bottom:1px solid #f0f2f5;}
.bcd-task-item:last-child{border-bottom:none;}
.task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.task-dot-red{background:var(--status-urgent-bg);}
.task-dot-orange{background:var(--status-urgent-notimportant-bg);}
.task-dot-yellow{background:var(--status-noturgent-important-bg);}
.task-dot-teal{background:var(--status-normal-bg);}
.task-title-inline{font-size:12.5px;font-weight:700;color:var(--dark);line-height:1.4;flex:1;min-width:0;}
.no-task-msg{font-size:12px;color:var(--gray-text);padding:10px 0;text-align:center;opacity:.5;}
.bcd-time{padding:4px 12px 8px;font-size:11px;color:var(--gray-text);font-weight:500;display:flex;align-items:center;gap:4px;}
.bcd-time-icon{font-size:10px;opacity:.7;}
.right-panel{width:285px;flex-shrink:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;}
.rp-header{padding:12px 16px 10px;border-bottom:1.5px solid var(--gray-border);flex-shrink:0;}
.rp-title{font-size:15px;font-weight:800;color:var(--dark);}
.notif-list{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:7px;}
.notif-section-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-text);padding:5px 0 2px;display:flex;align-items:center;gap:6px;}
.notif-section-label::after{content:'';flex:1;height:1px;background:var(--gray-border);}
.notif-card{border-radius:9px;border:1.5px solid;padding:8px 10px;cursor:pointer;transition:box-shadow .15s,transform .12s;}
.notif-card:hover{box-shadow:var(--shadow-md);transform:translateX(2px);}
.nc-red{background:#fdecea;border-color:rgba(192,57,43,.22);}
.nc-orange{background:#fff2e8;border-color:rgba(224,123,58,.3);}
.nc-yellow{background:#fffbdf;border-color:rgba(212,160,23,.3);}
.nc-teal{background:#e8f5f4;border-color:rgba(0,121,107,.2);}
.nc-row{display:flex;align-items:flex-start;gap:6px;}
.nc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.nc-dot-red{background:var(--status-urgent-bg);}
.nc-dot-orange{background:var(--status-urgent-notimportant-bg);}
.nc-dot-yellow{background:var(--status-noturgent-important-bg);}
.nc-dot-teal{background:var(--status-normal-bg);}
.nc-info{flex:1;min-width:0;}
.nc-title{font-size:12px;font-weight:800;color:var(--dark);margin-bottom:3px;line-height:1.3;}
.nc-content{font-size:11px;font-weight:500;color:#4b5563;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.nc-detail-link{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:10px;font-weight:700;color:var(--green-dark);opacity:.85;transition:opacity .12s;}
.nc-detail-link:hover{opacity:1;}
.nc-detail-link svg{width:9px;height:9px;}
.rp-add-btn{margin:8px 10px 12px;padding:11px;background:var(--topbar-bg);color:var(--topbar-text-dark);border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,transform .1s;flex-shrink:0;box-shadow:0 2px 8px rgba(200,160,0,.25);}
.rp-add-btn:hover{background:#f0cc50;}
.rp-add-btn:active{transform:scale(.98);}
.rp-add-plus{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;}
/* Page label */
.page-label-bar{padding:8px 18px;background:#fffbdf;border-bottom:2px solid var(--status-noturgent-important-bg);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.page-label-dot{width:10px;height:10px;border-radius:50%;background:var(--status-noturgent-important-bg);}
.page-label-text{font-size:13px;font-weight:800;color:#5a3600;}
</style>
</head>

function getTopPriorityBadge(tasks){if(!tasks||tasks.length===0)return '';const uc=tasks.filter(t=>t.type==='urgent').length;const ic=tasks.filter(t=>t.type==='important').length;const wc=tasks.filter(t=>t.type==='waiting').length;if(uc>0)return `<div class="card-top-badge card-top-badge-red">🔴 ${uc} khẩn cấp</div>`;if(ic>0)return `<div class="card-top-badge card-top-badge-orange">${ic} quan trọng</div>`;if(wc>0)return `<div class="card-top-badge card-top-badge-yellow">Xin Chỉ Dạy</div>`;return '';}

function buildDetailCard(b){let visibleTasks=(b.tasks||[]).filter(t=>t.type==='waiting');const badgeHtml=getTopPriorityBadge(b.tasks);let tasksHtml='';if(visibleTasks.length>0){visibleTasks.forEach(t=>{tasksHtml+=`<div class="bcd-task-item"><div class="task-dot task-dot-yellow"></div><div class="task-title-inline">${t.title}</div></div>`;});}else{tasksHtml=`<div class="no-task-msg">Không có thông báo nào</div>`;}let timeHtml='';if(visibleTasks.length>0&&BAN_TIMES[b.id]){timeHtml=`<div class="bcd-time"><span class="bcd-time-icon">🕐</span>${BAN_TIMES[b.id]}</div>`;}return `<div class="ban-card-detail" onclick="alert('Chi tiết: ${b.name}')">${badgeHtml}<div class="bcd-top">${getIconHTMLDetail(b.iconKey)}<div class="bcd-name">${b.name}</div></div><div class="bcd-body">${tasksHtml}</div>${timeHtml}</div>`;}

function renderChiTiet(){const filtered=BANS_DATA.filter(b=>b.tasks&&b.tasks.some(t=>t.type==='waiting'));const sorted=[...filtered].sort((a,b)=>(b.tasks&&b.tasks.length?1:0)-(a.tasks&&a.tasks.length?1:0));let html=`<div class="ban-grid-detail">`;sorted.forEach(b=>{html+=buildDetailCard(b);});html+=`</div>`;document.getElementById('banContainer').innerHTML=html;}

function buildNotifCard(n){const c=colorMap[n.level]||colorMap['orange'];return `<div class="notif-card ${c.card}"><div class="nc-row"><div class="nc-dot ${c.dot}"></div><div class="nc-info"><div class="nc-title">${n.title}</div><div class="nc-content">${n.content}</div><div class="nc-detail-link">Xem chi tiết <svg viewBox="0 0 10 10" fill="none"><path d="M2 5h6M5.5 2.5L8 5l-2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div></div></div>`;}

function renderNotifs(){const L=document.getElementById('notifList');const redItems=NOTIFS_MAIN.filter(n=>n.level==='red');const orangeItems=NOTIFS_MAIN.filter(n=>n.level==='orange');let h='';if(redItems.length){h+=`<div class="notif-section-label">🔴 Khẩn Cấp</div>`;redItems.forEach(n=>{h+=buildNotifCard(n);});}if(orangeItems.length){h+=`<div class="notif-section-label">📌 Tin Tức</div>`;orangeItems.forEach(n=>{h+=buildNotifCard(n);});}L.innerHTML=h;}
