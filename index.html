<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi Tiết – Xin Chỉ Dạy</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green-dark:#1a5c3a;--gray-bg:#f0f2f5;--gray-border:#e2e5ea;--gray-text:#6b7280;--dark:#111827;
  --topbar-h:56px;--font:'Be Vietnam Pro',sans-serif;
  --shadow-sm:0 1px 4px rgba(0,0,0,.07);--shadow-md:0 4px 16px rgba(0,0,0,.1);
  --status-urgent-bg:#c0392b;--status-urgent-notimportant-bg:#e07b3a;
  --status-noturgent-important-bg:#d4a017;--status-normal-bg:#00796b;
  --topbar-bg:#fad96a;--topbar-border:#f0c840;--topbar-logo-color:#7a3a00;--topbar-text-dark:#5a2d00;
  --topbar-date-bg:rgba(255,255,255,0.55);--topbar-date-border:rgba(255,255,255,0.6);
  --topbar-btn-bg:rgba(255,255,255,0.5);--topbar-btn-border:rgba(255,200,60,0.5);
  --topbar-user-bg:rgba(255,255,255,0.5);--topbar-lunar-color:#8b4a00;
  --icon-bg:#f5f0e8;
}
html,body,input,select,button{font-family:var(--font);}
html,body{background:var(--gray-bg);color:var(--dark);height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
.topbar{height:var(--topbar-h);background:var(--topbar-bg);border-bottom:1.5px solid var(--topbar-border);display:flex;align-items:center;padding:0 18px;flex-shrink:0;z-index:100;box-shadow:0 2px 8px rgba(180,120,0,.18);}
.tb-logo{display:flex;align-items:center;gap:10px;}
.tb-logo-main{font-size:17px;font-weight:800;color:var(--topbar-logo-color);letter-spacing:-.3px;}
.tb-divider{width:1px;height:28px;background:rgba(140,80,0,.25);margin:0 14px;flex-shrink:0;}
.tb-date{padding:5px 12px;background:var(--topbar-date-bg);border-radius:9px;border:1px solid var(--topbar-date-border);}
.tb-date-solar{font-size:14px;font-weight:700;color:var(--topbar-text-dark);line-height:1;}
.tb-date-lunar{font-size:11px;color:var(--topbar-lunar-color);font-weight:600;margin-top:3px;line-height:1;}
.tb-filter-label{margin-left:14px;padding:6px 14px;background:rgba(212,160,23,.12);border-radius:8px;border:1.5px solid rgba(212,160,23,.4);font-size:13px;font-weight:800;color:#8a5e00;display:flex;align-items:center;gap:6px;}
.tb-spacer{flex:1;}
.tb-actions{display:flex;align-items:center;gap:6px;}
.tb-btn{width:36px;height:36px;background:var(--topbar-btn-bg);border-radius:9px;border:1px solid var(--topbar-btn-border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:16px;}
.tb-notif-count{position:absolute;top:-3px;right:-3px;background:var(--status-urgent-bg);color:#fff;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--topbar-bg);}
.tb-user{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;background:var(--topbar-user-bg);border-radius:9px;border:1px solid var(--topbar-btn-border);cursor:pointer;margin-left:3px;}
.tb-avatar{width:28px;height:28px;border-radius:50%;background:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.tb-user-name{font-size:13px;font-weight:700;color:var(--topbar-text-dark);line-height:1.2;}
.tb-user-role{font-size:10px;color:var(--topbar-lunar-color);margin-top:1px;}
.main-body{height:calc(100vh - var(--topbar-h));display:flex;flex-direction:column;overflow:hidden;}
.legend-row{padding:6px 18px;background:#fff;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;gap:16px;flex-shrink:0;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gray-text);font-weight:500;}
.lb{width:10px;height:10px;border-radius:50%;}
.lb-red{background:var(--status-urgent-bg);}
.lb-orange{background:var(--status-urgent-notimportant-bg);}
.lb-yellow{background:var(--status-noturgent-important-bg);}
.lb-teal{background:var(--status-normal-bg);}
.ban-area{flex:1;overflow-y:auto;padding:14px 18px;}
.ban-grid-detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.ban-card-detail{background:#fff;border-radius:14px;border:1.5px solid var(--gray-border);overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .18s;box-shadow:var(--shadow-sm);position:relative;}
.ban-card-detail:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.card-top-badge{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;height:22px;border-radius:11px;font-size:10px;font-weight:800;padding:0 9px;box-shadow:0 1px 5px rgba(0,0,0,.18);border:2px solid #fff;white-space:nowrap;z-index:5;}
.card-top-badge-yellow{background:var(--status-noturgent-important-bg);color:#5a3600;}
.bcd-top{display:flex;align-items:center;gap:10px;padding:12px 110px 10px 12px;border-bottom:1px solid var(--gray-border);}
.bcd-icon-wrap{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:var(--icon-bg);}
.bcd-name{font-size:16px;font-weight:800;color:var(--dark);line-height:1.2;flex:1;}
.bcd-body{padding:10px 12px 4px;}
.bcd-task-item{display:flex;align-items:flex-start;gap:6px;padding:5px 0;border-bottom:1px solid #f0f2f5;}
.bcd-task-item:last-child{border-bottom:none;}
.task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.task-dot-yellow{background:var(--status-noturgent-important-bg);}
.task-title-inline{font-size:12.5px;font-weight:700;color:var(--dark);line-height:1.4;flex:1;}
.bcd-time{padding:4px 12px 8px;font-size:11px;color:var(--gray-text);font-weight:500;display:flex;align-items:center;gap:4px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-logo">
    <svg width="34" height="34" viewBox="0 0 42 42" fill="none" style="flex-shrink:0;border-radius:7px;">
      <rect width="42" height="42" rx="8" fill="#c9a84c"/>
      <rect x="12" y="26" width="18" height="10" fill="#1a4a2e"/>
      <rect x="18" y="28" width="6" height="8" rx="1" fill="#c9a84c"/>
      <polygon points="6,26 21,17 36,26" fill="#1a4a2e"/>
      <polygon points="12,19 21,12 30,19" fill="#2d6a4f"/>
      <polygon points="18,12 21,6 24,12" fill="#c9a84c"/>
    </svg>
    <div class="tb-logo-main">Quản Lý Công Việc</div>
  </div>
  <div class="tb-divider"></div>
  <div class="tb-date">
    <div class="tb-date-solar">Th2, 04/05/2026</div>
    <div class="tb-date-lunar">🌙 18 tháng 3 Bính Ngọ</div>
  </div>
  <div class="tb-filter-label">🙏 Xin Chỉ Dạy</div>
  <div class="tb-spacer"></div>
  <div class="tb-actions">
    <div class="tb-btn">🔔<div class="tb-notif-count">3</div></div>
    <div class="tb-btn">⚙️</div>
    <div class="tb-user">
      <div class="tb-avatar">AD</div>
      <div><div class="tb-user-name">Admin</div><div class="tb-user-role">Quản trị viên</div></div>
    </div>
  </div>
</div>
<div class="main-body">
  <div class="legend-row">
    <div class="legend-item"><div class="lb lb-red"></div> Khẩn Cấp</div>
    <div class="legend-item"><div class="lb lb-orange"></div> Quan Trọng</div>
    <div class="legend-item"><div class="lb lb-yellow"></div> Xin Chỉ Dạy</div>
    <div class="legend-item"><div class="lb lb-teal"></div> Bình Thường</div>
  </div>
  <div class="ban-area"><div id="banContainer"></div></div>
</div>
<script>
const IC='#1a5c3a',IB='#f5f0e8';
const ICONS={
  'huong-dan-pt':{svg:`<svg viewBox="0 0 32 32" fill="none"><path d="M16 10 Q13 6 13 3 Q13 1 16 1 Q19 1 19 3 Q19 6 16 10 Z" fill="${IC}"/><ellipse cx="16" cy="11" rx="4" ry="2" fill="${IC}" opacity=".7"/><line x1="16" y1="13" x2="16" y2="20" stroke="${IC}" stroke-width="3" stroke-linecap="round"/><path d="M7 19 Q11 15 16 19 Q21 23 25 19" stroke="${IC}" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M7 24 Q11 20 16 24 Q21 28 25 24" stroke="${IC}" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".7"/></svg>`},
  'nghi-le':{svg:`<svg viewBox="0 0 32 32" fill="none"><rect x="6" y="5" width="20" height="24" rx="2" fill="${IC}"/><rect x="8" y="7" width="16" height="20" rx="1" fill="${IB}"/><line x1="11" y1="13" x2="21" y2="13" stroke="${IC}" stroke-width="1.8" stroke-linecap="round" opacity=".7"/><line x1="11" y1="17" x2="21" y2="17" stroke="${IC}" stroke-width="1.8" stroke-linecap="round" opacity=".7"/><line x1="11" y1="21" x2="17" y2="21" stroke="${IC}" stroke-width="1.8" stroke-linecap="round" opacity=".7"/><path d="M19 7 L19 15 L16.5 12 L14 15 L14 7 Z" fill="${IC}"/></svg>`},
};
const BANS_DATA=[
  {id:14,name:'Ban HD Phật tử',iconKey:'huong-dan-pt',tasks:[{title:'Xin chỉ dạy về lịch sinh hoạt tháng 5',type:'waiting'}]},
  {id:16,name:'Ban Nghi Lễ',iconKey:'nghi-le',tasks:[{title:'Xin chỉ dạy về nghi thức lễ Phật Đản',type:'waiting'}]},
];
const BAN_TIMES={14:'2h trước',16:'2h trước'};
function getIcon(k){const ic=ICONS[k]||ICONS['nghi-le'];return `<div class="bcd-icon-wrap">${ic.svg}</div>`;}
function render(){
  let html=`<div class="ban-grid-detail">`;
  BANS_DATA.forEach(b=>{
    const tasks=b.tasks.filter(t=>t.type==='waiting');
    const tasksHtml=tasks.map(t=>`<div class="bcd-task-item"><div class="task-dot task-dot-yellow"></div><div class="task-title-inline">${t.title}</div></div>`).join('');
    const time=BAN_TIMES[b.id]?`<div class="bcd-time">🕐 ${BAN_TIMES[b.id]}</div>`:'';
    html+=`<div class="ban-card-detail"><div class="card-top-badge card-top-badge-yellow">🙏 Xin Chỉ Dạy</div><div class="bcd-top">${getIcon(b.iconKey)}<div class="bcd-name">${b.name}</div></div><div class="bcd-body">${tasksHtml}</div>${time}</div>`;
  });
  html+=`</div>`;
  document.getElementById('banContainer').innerHTML=html;
}
render();
</script>
</body>
</html>
